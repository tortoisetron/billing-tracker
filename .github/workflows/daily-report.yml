name: Claude API Daily Cost Report

on:
  schedule:
    # Runs every weekday at 9:00 AM IST (3:30 AM UTC)
    - cron: "30 3 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run daily cost report
        env:
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/daily-report.js
